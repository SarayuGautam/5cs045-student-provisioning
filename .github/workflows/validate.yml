name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint PHP
        run: find admin web bin -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: find setup bin test -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
