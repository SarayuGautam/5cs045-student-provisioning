# /etc/ssh/sshd_config.d/50-students.conf
#
# Applies server-wide (this is a dedicated teaching VM, not a general
# multi-purpose box, so there's no need to scope this to a Match block).
#
# Password-based auth, matching your old server (Server_Access_Guide) and
# the new registration flow (email in, generated username+password out).
# Many students — especially first-years in Week 1, per the lesson plan —
# won't have an SSH keypair yet, and asking ~100+ of them to generate and
# correctly paste one via a web form is real support burden for not much
# benefit in a teaching context. Compensating controls for the weaker
# auth model: fail2ban (installed by setup/00-server-setup.sh) bans an IP
# after repeated failed attempts; passwords are long, randomly generated,
# and never reused between students; no student has sudo.
#
# No chroot here either, same reasoning as the rest of this file's
# predecessor: students need a real shell for git/composer/PHP CLI work.

PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
MaxAuthTries 4
