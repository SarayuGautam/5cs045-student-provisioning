PasswordAuthentication yes
PermitEmptyPasswords no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
MaxAuthTries 4
# A whole lab logs in at once, and a connection counts as "not yet logged in" for as long as
# someone is typing their password. The default (10:30:100) starts dropping connections once
# 10 are waiting: in testing, 25 of 60 simultaneous logins were refused. This fits the whole
# cohort: random drops start at 1000 waiting, all new ones are refused at 1500.
MaxStartups 1000:30:1500
# Time allowed to type the password (default 120s). Shorter means abandoned or hostile
# half-open connections are cleaned up sooner.
LoginGraceTime 60

# Every student connection (a login, scp, sftp or a single command) goes through a wrapper that
# runs what the student asked for, then lets the web server read what they uploaded. Without it,
# pages uploaded with Windows' built-in scp give 403. See bin/student-ssh-session.sh.
# The wrapper runs sftp through the Subsystem command, so Subsystem must stay an external
# sftp-server (Ubuntu's default), not internal-sftp. A Match block runs to the end of this file,
# so keep it last.
Match Group 5cs045-students
    ForceCommand /usr/local/sbin/5cs045/bin/student-ssh-session.sh
