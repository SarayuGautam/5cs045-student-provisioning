# Installed as /etc/security/limits.d/5cs045-students.conf by the setup scripts.
# A second process limit for students, applied at every SSH login by pam_limits. The main
# limits live in each student's systemd slice; this one still holds if a login burst means
# a session could not be created, so a fork bomb can never take the server down.
# It is higher than the slice limit (200), so normally the slice limit is the one reached.
@5cs045-students  hard  nproc  300
