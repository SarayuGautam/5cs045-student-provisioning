; /etc/php/8.3/fpm/pool.d/5cs045-admin.conf
; The admin panel's PHP. It runs as its own user, 5cs045-admin, which can do nothing on its
; own: every privileged change goes through bin/admin-action (see templates/sudoers-5cs045-admin),
; which checks the signed-in account and its panel role.
[5cs045-admin]
user = 5cs045-admin
group = 5cs045-admin

listen = /run/php/php8.3-fpm-5cs045-admin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s
pm.max_requests = 500

php_admin_value[session.save_path] = "/var/lib/5cs045-admin/sessions"
php_admin_value[session.name] = "admin_session"
php_admin_value[session.cookie_secure] = On
php_admin_value[session.cookie_httponly] = On
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.use_strict_mode] = On
php_admin_value[session.gc_maxlifetime] = 43200
php_admin_value[open_basedir] = "/var/www/5cs045-admin:/var/lib/5cs045-admin:/tmp"
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 120
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = "/var/lib/5cs045-admin/php-error.log"
php_admin_value[expose_php] = Off
catch_workers_output = yes
