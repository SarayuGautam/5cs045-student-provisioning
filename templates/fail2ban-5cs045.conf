[sshd]
enabled = true
# A ban only blocks the ports listed here, and SSH on this server is not on 22. Setup and
# update-server.sh replace "ssh" with the ports sshd really listens on (bin/ssh-ports.sh).
port = ssh
maxretry = 5
findtime = 10m
bantime = 1h

# An address that keeps getting banned by the jail above - a bot that just waits
# out the hour and comes back - gets banned much longer instead of indefinitely
# retrying. This matters more once the server has a public hostname than it did
# on a private IP.
[recidive]
enabled = true
bantime = 1w
findtime = 1d
maxretry = 3
