# /etc/nginx/sites-available/students
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/5cs045-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/5cs045-selfsigned.key;
    root /var/www/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location = /smtp_config.php {
        deny all;
        return 404;
    }

    location /lib/ {
        deny all;
        return 404;
    }

    location ~ ^/~(?<homeuser>[a-z][a-z0-9_]+)$ {
        return 301 /~$homeuser/;
    }

    # The student's front page: a welcome message and what each folder is for.
    location ~ ^/~(?<homeuser>[a-z][a-z0-9_]+)/$ {
        default_type text/html;
        charset utf-8;
        return 200 '<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome $homeuser</title>
<style>body{font-family:system-ui,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem;color:#1f2937;line-height:1.5}li{margin-bottom:.6rem}</style>
</head>
<body>
<h1>Welcome, $homeuser</h1>
<p>Use this server for your Full Stack Development module: build, test and publish your PHP and MySQL websites.</p>
<ul>
<li><a href="workshops/">workshops</a> - your weekly workshop work, one folder for each week.</li>
<li><a href="exam/">exam</a> - the timed practical exam.</li>
<li><a href="assessment/">assessment</a> - your final assessment project.</li>
</ul>
</body>
</html>
';
    }

    location ~ ^/~(?<sname>[a-z][a-z0-9_]+)/(?<area>workshops|exam|assessment)(?<rest>/.*)?$ {
        set $student_root /srv/students/$sname/$area;
        alias $student_root$rest;
        index index.php index.html;

        location ~ ^/~(?<sname2>[a-z][a-z0-9_]+)/(?<area2>workshops|exam|assessment)(?<phprest>.*\.php)$ {
            alias /srv/students/$sname2/$area2$phprest;
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm-$sname2.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME $uri;
        }
    }

    location = / {
        default_type text/plain;
        return 200 "5CS045 student server\n";
    }

    location /phpmyadmin {
        auth_basic "5CS045 phpMyAdmin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        alias /usr/share/phpmyadmin;
        index index.php;
        try_files $uri $uri/ =404;

        location ~ ^/phpmyadmin/(.+\.php)$ {
            alias /usr/share/phpmyadmin/$1;
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # Public student registration. There is no Basic Auth here.
    location = /register.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }

    location = /register_handler.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
}
