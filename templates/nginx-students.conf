# /etc/nginx/sites-available/students — 5CS045 student server
#
# Deliberately ONE shared server block for every student, routing by URL
# path to per-student document roots and per-student PHP-FPM sockets. This
# means add-student.sh never has to touch nginx config or reload nginx —
# only PHP-FPM gets a new pool file + reload. Nginx config here is static,
# written once by setup/00-server-setup.sh.
#
# URL shape:
#   https://<server>/~<username>/workshops/...
#   https://<server>/~<username>/exams/...
#   https://<server>/~<username>/assessments/...
#
# Change STUDENT_ROOT below to match add-student.sh's STUDENT_ROOT if you
# edit that.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Self-signed by default (generated by setup/00-server-setup.sh) so HTTPS
    # actually works out of the box — Week 10 has students testing the
    # Secure cookie flag, which only takes effect over HTTPS. Browsers will
    # show a one-time trust warning students click past; swap in a real
    # Let's Encrypt cert here once you have a domain name pointed at this
    # VM (see README "HTTPS").
    ssl_certificate     /etc/nginx/ssl/5cs045-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/5cs045-selfsigned.key;

    root /var/www/html;

    # Never serve git metadata or dotfiles — students will have .git
    # directories in every folder (git commits are graded), and a world-
    # readable .git/ lets anyone reconstruct the entire repo + history with
    # an off-the-shelf tool. This is the single most important line in this
    # file.
    location ~ /\. {
        deny all;
        return 404;
    }

    # smtp_config.php (holds the SMTP relay password) and lib/ (internal
    # PHP classes) are only ever loaded via require() from inside
    # register_handler.php — never a legitimate direct URL. Without this
    # explicit deny they would fall through to the static-file default
    # location below and be served as PLAIN TEXT SOURCE to anyone who
    # requests them, leaking the SMTP password. Deny beats every other
    # location for these exact paths regardless of match order below.
    location = /smtp_config.php {
        deny all;
        return 404;
    }
    location /lib/ {
        deny all;
        return 404;
    }

    # Per-student areas: ~username/{workshops,exams,assessments}/...
    location ~ ^/~(?<sname>[a-z][a-z0-9_]+)/(?<area>workshops|exams|assessments)(?<rest>/.*)?$ {
        set $student_root /srv/students/$sname/$area;
        alias $student_root$rest;
        index index.php index.html;
        try_files $uri $uri/ /~$sname/$area/index.php$is_args$args =404;

        location ~ ^/~(?<sname2>[a-z][a-z0-9_]+)/(?<area2>workshops|exams|assessments)(?<phprest>.*\.php)$ {
            alias /srv/students/$sname2/$area2$phprest;
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm-$sname2.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME $uri;
        }
    }

    location = / {
        return 200 "5CS045 student server\n";
        add_header Content-Type text/plain;
    }

    # phpMyAdmin — Task 1 in the assessment brief has students "creating a
    # table in MySQL via phpMyAdmin", so this needs to exist even though it
    # wasn't in the original stack list. Each student logs in with their own
    # MySQL credentials (from add-student.sh) — phpMyAdmin itself enforces
    # that boundary, so no per-student routing is needed here, just one
    # shared instance. HTTP Basic Auth in front is a second layer (raises
    # the bar against credential-stuffing bots hitting a stock phpMyAdmin
    # login page, a very commonly scanned-for target).
    location /phpmyadmin {
        auth_basic "5CS045 phpMyAdmin";
        auth_basic_user_file /etc/nginx/.htpasswd-register;
        alias /usr/share/phpmyadmin;
        index index.php;
        try_files $uri $uri/ =404;
        location ~ ^/phpmyadmin/(.+\.php)$ {
            alias /usr/share/phpmyadmin/$1;
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # Admin/registration pages (register.php, register_handler.php) — these
    # are NOT student content, so they run under the default www-data pool,
    # not a per-student one. Gate with HTTP Basic Auth (see setup script).
    location ~ ^/(register\.php|register_handler\.php)$ {
        auth_basic "5CS045 registration";
        auth_basic_user_file /etc/nginx/.htpasswd-register;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
}
