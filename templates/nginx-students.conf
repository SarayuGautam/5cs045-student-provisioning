# /etc/nginx/sites-available/students
# Two sites share this server, and nothing is served on both. Students' pages run their own
# scripts, so they must never share an address (and with it cookies) with the sign-up page,
# phpMyAdmin or the admin panel:
#   fullstack-student.heraldcollege.edu.np  students' websites, and nothing else
#   fullstack.heraldcollege.edu.np          sign-up and phpMyAdmin (the admin panel is on port 8443)
# The bare IP and any other name are treated like fullstack.heraldcollege.edu.np.
server {
    listen 80;
    listen [::]:80;
    # "_" keeps this answering on the bare IP too. The two real hostnames are
    # listed explicitly so this vhost is ready as soon as DNS points at it -
    # no config change needed the day the domains go live.
    server_name _ fullstack.heraldcollege.edu.np fullstack-student.heraldcollege.edu.np;
    return 301 https://$host$request_uri;
}

# Students' websites: https://fullstack-student.heraldcollege.edu.np/~<username>/
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fullstack-student.heraldcollege.edu.np;

    ssl_certificate     /etc/nginx/ssl/5cs045-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/5cs045-selfsigned.key;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ ^/~(?<homeuser>[a-z][a-z0-9_]+)$ {
        return 301 /~$homeuser/;
    }

    # The student's front page: a welcome message and what each folder is for.
    location ~ ^/~(?<homeuser>[a-z][a-z0-9_]+)/$ {
        default_type text/html;
        charset utf-8;
        return 200 '<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome, $homeuser</title>
<style>
body{margin:0;padding:clamp(48px,12vh,128px) 24px 64px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.65;color:#000;background:#fff}
main{max-width:34rem;margin:0 auto}
h1{margin:0 0 20px;font-size:2rem;line-height:1.2;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{margin:56px 0 24px;font-size:1rem;font-weight:600}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
li{margin:0 0 28px}
li a{font-weight:600}
li p{margin-top:2px}
a{color:#000;text-underline-offset:3px}
.back{display:inline-block;margin-top:48px}
</style>
</head>
<body>
<main>
<h1>Welcome, $homeuser</h1>
<p>Use this server for your Full Stack Development module: build, test and publish your PHP and MySQL websites.</p>
<h2>Your folders</h2>
<ul>
<li><a href="workshops/">Workshops</a><p>Your weekly workshop work, one folder for each week.</p></li>
<li><a href="exam/">Exam</a><p>Your timed practical exam.</p></li>
<li><a href="assessment/">Assessment</a><p>Your final assessment project.</p></li>
</ul>
</main>
</body>
</html>
';
    }

    location ~ ^/~(?<sname>[a-z][a-z0-9_]+)/(?<area>workshops|exam|assessment)(?<rest>/.*)?$ {
        # Student PHP accepts uploads up to 20 MB (php-fpm-pool.conf.template). Without this,
        # nginx's own 1 MB limit applies first and larger uploads fail with 413. Only student
        # sites get it; the sign-up page and phpMyAdmin keep the 1 MB default.
        client_max_body_size 20m;
        set $student_root /srv/students/$sname/$area;
        alias $student_root$rest;
        index index.php index.html;

        location ~ ^/~(?<sname2>[a-z][a-z0-9_]+)/(?<area2>workshops|exam|assessment)(?<phprest>.*\.php)$ {
            alias /srv/students/$sname2/$area2$phprest;
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm-$sname2.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME $uri;
        }
    }

    # Nothing else is on this name: no sign-up page, phpMyAdmin or admin panel
    location / {
        return 404;
    }
}

# Sign-up and phpMyAdmin: https://fullstack.heraldcollege.edu.np/ (and the bare IP)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _ fullstack.heraldcollege.edu.np;

    ssl_certificate     /etc/nginx/ssl/5cs045-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/5cs045-selfsigned.key;
    root /var/www/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location = /smtp_config.php {
        deny all;
        return 404;
    }

    location /lib/ {
        deny all;
        return 404;
    }

    # Students' websites have their own name. Old links to them here still get there.
    location ~ ^/~ {
        return 301 https://fullstack-student.heraldcollege.edu.np$request_uri;
    }

    # Root shows the registration page directly.
    location = / {
        rewrite ^/$ /index.php last;
    }

    # No Basic Auth here: students log in with their own MySQL
    # username and password on phpMyAdmin's own login page.
    location /phpmyadmin {
        alias /usr/share/phpmyadmin;
        index index.php;
        try_files $uri $uri/ =404;

        location ~ ^/phpmyadmin/(.+\.php)$ {
            alias /usr/share/phpmyadmin/$1;
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # Public student registration, served at the site root. There is no Basic Auth here.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }

    # Old bookmarks/links to /register.php still land on the registration page.
    location = /register.php {
        return 301 /;
    }

    location = /register_handler.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
}
