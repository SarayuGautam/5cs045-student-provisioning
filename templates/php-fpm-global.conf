; /etc/php/8.3/fpm/pool.d/00-5cs045-global.conf
; PHP reloads every time a student is added or removed. Without this, a reload cuts off every
; request that is running at that moment (a student's page, the registration page, the admin
; panel) with "502 Bad Gateway". With it, running requests get up to 10 seconds to finish first.
[global]
process_control_timeout = 10s
