<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Installed as /etc/dbus-1/system.d/5cs045-limits.conf by the setup scripts.

     Every SSH login asks systemd-logind (over the system bus) to create a session. That
     session is what puts the student inside their CPU, memory and process limits. Each
     request is a separate bus connection from root, and the bus allows only 256 per user
     by default, 64 of them still authenticating. In a load test, 400 logins at once gave
     171 "Failed to create session: No buffer space available": those students got in
     with no limits at all. These values fit a whole cohort logging in at once. -->
<busconfig>
  <limit name="max_connections_per_user">4096</limit>
  <limit name="max_incomplete_connections">1024</limit>
  <limit name="max_completed_connections">8192</limit>
</busconfig>
