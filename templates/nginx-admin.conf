# /etc/nginx/sites-available/5cs045-admin
# The admin panel, on its own port so students never meet it: https://<server>:8443
# Only addresses in /etc/5cs045/admin-allow.conf may connect (change them on the panel's
# Security page, or with: sudo /usr/local/sbin/5cs045/bin/admin-allow.sh). Everyone else gets 403
# before any PHP runs. The PHP action checks the signed-in account and its panel role.
# It answers on fullstack.heraldcollege.edu.np and the bare IP, never on the students' name.
server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _ fullstack.heraldcollege.edu.np;

    ssl_certificate     /etc/nginx/ssl/5cs045-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/5cs045-selfsigned.key;

    include /etc/5cs045/admin-allow.conf;

    root /var/www/5cs045-admin/public;
    client_max_body_size 1m;
    access_log /var/log/nginx/5cs045-admin.access.log;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    # Plain http:// on this port would get a confusing 400; send the browser to https instead.
    error_page 497 =301 https://$host:8443$request_uri;

    location /assets/ {
        # Be explicit about static asset MIME types. X-Content-Type-Options: nosniff
        # makes browsers reject CSS/JS when nginx sends an ambiguous content type.
        types {
            text/css css;
            application/javascript js;
            font/woff2 woff2;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-5cs045-admin.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/5cs045-admin/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120s;
    }
}

# fullstack-student.heraldcollege.edu.np is only for students' websites, so on this port it refuses
# the secure connection and the browser shows no page at all.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name fullstack-student.heraldcollege.edu.np;
    ssl_reject_handshake on;
    # A request that names this host after connecting under another name is simply dropped
    return 444;
}
