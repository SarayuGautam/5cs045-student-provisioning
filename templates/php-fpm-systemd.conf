# Installed as /etc/systemd/system/php8.3-fpm.service.d/5cs045.conf by the setup scripts.
# PHP keeps one open file per student pool, plus two per running worker. With the systemd
# default of 1024 open files, about 900 pools leave room for only ~50 busy workers, and
# every page after that fails with "Too many open files". Tested with 900 pools.
[Service]
LimitNOFILE=65536
